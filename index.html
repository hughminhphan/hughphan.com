<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>hugh phan</title>
<meta name="description" content="i build robots, circuit boards and the agents that make them. then i make videos about it.">
<meta property="og:title" content="hugh phan">
<meta property="og:description" content="robots, circuit boards and the agents that make them">
<meta property="og:url" content="https://hughphan.com">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feMorphology in="SourceGraphic" operator="dilate" radius=".6" result="d"/><feGaussianBlur in="d" stdDeviation="1.3" result="b"/><feComponentTransfer in="b" result="t"><feFuncA type="linear" slope="3.2" intercept="-1.0"/></feComponentTransfer><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="t" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<main class="wrap">
<h1>hugh <k>phan</k></h1>
<p class="lede" id="lede"></p>
<ul class="socials" id="socials-top"></ul>

<h2>free skills</h2>
<ul class="skills" id="skills"></ul>

<h2>projects</h2>
<ul class="projects" id="projects"></ul>

<h2>on github</h2>
<div class="graph-scroll" id="graph-scroll"><div class="graph" id="graph"></div></div>
<p class="cap" id="graph-cap"></p>

<h2>now</h2>
<p class="lede" id="now"></p>

<h2>follow along</h2>
<ul class="socials" id="socials"></ul>
<p class="fine" id="updated"></p>
</main>

<script src="content.js"></script>
<script src="gh-data.js"></script>
<script>
(() => {
  const C = window.CONTENT, G = window.GH;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  const dateFmt = (s) => { const d = new Date(s + "T00:00:00"); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };

  $("lede").textContent = C.lede;
  const socials = C.socials.map((s) => `<li><a href="${s.href}">${s.label}</a></li>`).join("");
  $("socials-top").innerHTML = socials;
  $("socials").innerHTML = socials;
  $("now").innerHTML = esc(C.now).replace("alloy robotics", "<b>alloy robotics</b>");

  $("skills").innerHTML = C.skills.map((s) =>
    `<li><a href="${s.href}"><img src="${s.img}" alt=""><div><b>${esc(s.title)}</b><span>${esc(s.line)}</span></div></a></li>`
  ).join("");

  $("projects").innerHTML = C.projects.map((p) => {
    const r = G.repos[p.repo] || {};
    const url = r.url || `https://github.com/hughminhphan/${p.repo}`;
    const meta = [r.stars ? `★ ${r.stars}` : "", r.lang ? r.lang.toLowerCase() : "", r.pushed ? r.pushed.slice(0, 4) : ""].filter(Boolean).join(" · ");
    const pic = p.video
      ? `<div class="pic"><video src="${p.video.src}" poster="${p.video.poster}" width="${p.video.w}" height="${p.video.h}" muted loop playsinline autoplay preload="metadata" aria-hidden="true"></video></div>`
      : "";
    const links = `<a href="${url}">github</a>${p.live ? ` <a class="r" href="${p.live}">try it</a>` : ""}`;
    return `<li>${pic}<b>${esc(p.title)}</b><span>${esc(p.line)}</span><span class="meta">${meta}<span class="links">${links}</span></span></li>`;
  }).join("");

  // contribution graph, github's layout in the hub's colours
  const days = G.contributions.days;
  const nz = days.map((d) => d[1]).filter((n) => n > 0).sort((a, b) => a - b);
  const q = (p) => nz[Math.min(nz.length - 1, Math.floor(p * nz.length))] || 1;
  const cuts = [q(0.25), q(0.5), q(0.8)];
  const level = (n) => (n === 0 ? 0 : n <= cuts[0] ? 1 : n <= cuts[1] ? 2 : n <= cuts[2] ? 3 : 4);
  const lead = new Date(days[0][0] + "T00:00:00").getDay();
  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<i class="e"></i>`;
  days.forEach(([d, n]) => { cells += `<i class="l${level(n)}" title="${n} on ${dateFmt(d)}"></i>`; });
  $("graph").innerHTML = cells;
  $("graph").style.setProperty("--weeks", Math.ceil((days.length + lead) / 7));
  $("graph-scroll").scrollLeft = 1e6;
  $("graph-cap").innerHTML = `<span class="r">${G.contributions.total.toLocaleString("en-AU")} contributions</span> in the last year. ${G.stars} stars across ${G.publicRepos} public repos.`;
  $("updated").textContent = `github numbers as of ${dateFmt(G.updated)}.`;
})();
</script>
</body>
</html>
