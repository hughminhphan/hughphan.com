<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>hugh phan</title>
<meta name="description" content="i build robots, circuit boards and the agents that make them. then i make videos about it.">
<meta property="og:title" content="hugh phan">
<meta property="og:description" content="robots, circuit boards and the agents that make them">
<meta property="og:url" content="https://hughphan.com">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feMorphology in="SourceGraphic" operator="dilate" radius=".6" result="d"/><feGaussianBlur in="d" stdDeviation="1.3" result="b"/><feComponentTransfer in="b" result="t"><feFuncA type="linear" slope="3.2" intercept="-1.0"/></feComponentTransfer><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="t" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<main class="wrap">
<header class="top"><img class="me" id="me" alt="hugh phan" width="480" height="480"><h1>hugh <k>phan</k></h1></header>
<p class="lede" id="lede"></p>
<ul class="socials" id="socials-top"></ul>

<h2>wins</h2>
<div class="trophies" id="trophies"></div>
<ul class="wins" id="wins"></ul>

<h2>free skills</h2>
<ul class="skills" id="skills"></ul>

<h2>projects</h2>
<ul class="projects" id="projects"></ul>

<h2>yo-yo</h2>
<div class="yoyo" id="yoyo"></div>

<h2>on github</h2>
<div class="graph-scroll" id="graph-scroll"><div class="graph" id="graph"></div></div>
<p class="cap" id="graph-cap"></p>

<h2>now</h2>
<p class="lede" id="now"></p>

<h2>follow along</h2>
<ul class="socials" id="socials"></ul>
<p class="fine" id="updated"></p>
</main>

<script src="content.js"></script>
<script src="gh-data.js"></script>
<script>
(() => {
  const C = window.CONTENT, G = window.GH;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  const dateFmt = (s) => { const d = new Date(s + "T00:00:00"); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };

  $("lede").textContent = C.lede;
  $("me").src = C.photo;
  const fig = (t, cls) => `<figure class="${cls}"><img src="${t.src}" alt="${esc(t.alt)}" loading="lazy"><figcaption>${esc(t.cap)}</figcaption></figure>`;
  $("trophies").innerHTML = fig(C.trophies.hero, "hero") + `<div class="grid">${C.trophies.grid.map((t) => fig(t, "")).join("")}</div>`;
  $("wins").innerHTML = C.wins.map((w) =>
    `<li><div><b>${esc(w.what)}</b><span>${esc(w.detail)}</span></div><i>${esc(w.when)}</i></li>`
  ).join("");
  const socials = C.socials.map((s) => `<li><a href="${s.href}">${s.label}</a></li>`).join("");
  $("socials-top").innerHTML = socials;
  $("socials").innerHTML = socials;
  $("now").innerHTML = esc(C.now).replace("alloy robotics", "<b>alloy robotics</b>");

  $("skills").innerHTML = C.skills.map((s) =>
    `<li><a href="${s.href}"><img src="${s.img}" alt=""><div><b>${esc(s.title)}</b><span>${esc(s.line)}</span></div></a></li>`
  ).join("");

  $("projects").innerHTML = C.projects.map((p) => {
    const r = (p.repo && G.repos[p.repo]) || {};
    const url = p.repo ? r.url || `https://github.com/hughminhphan/${p.repo}` : null;
    const meta = p.meta || [r.stars ? `★ ${r.stars}` : "", r.lang ? r.lang.toLowerCase() : "", r.pushed ? r.pushed.slice(0, 4) : ""].filter(Boolean).join(" · ");
    const pic = p.video
      ? `<div class="pic"><video src="${p.video.src}" poster="${p.video.poster}" width="${p.video.w}" height="${p.video.h}" muted loop playsinline autoplay preload="metadata" aria-hidden="true"></video></div>`
      : "";
    const links = [
      p.watch ? `<a class="r" href="${p.watch}">${esc(p.watchLabel || "watch the pitch")}</a>` : "",
      url ? `<a href="${url}">github</a>` : "",
      p.live ? `<a class="r" href="${p.live}">try it</a>` : "",
    ].filter(Boolean).join(" ");
    return `<li>${pic}<b>${esc(p.title)}${p.badge ? ` <k>${esc(p.badge)}</k>` : ""}</b><span>${esc(p.line)}</span><span class="meta">${meta}<span class="links">${links}</span></span></li>`;
  }).join("");

  const Y = C.yoyo;
  $("yoyo").innerHTML = `<div class="pic"><video src="${Y.video.src}" poster="${Y.video.poster}" width="${Y.video.w}" height="${Y.video.h}" muted loop playsinline autoplay preload="metadata" aria-label="hugh doing yo-yo string tricks, with laser eyes"></video></div>
    <p class="lede">${esc(Y.line)}</p>
    <ul class="socials">${Y.links.map((l) => `<li><a href="${l.href}">${esc(l.label)}</a></li>`).join("")}</ul>`;

  // contribution graph, github's layout in the hub's colours
  const days = G.contributions.days;
  const nz = days.map((d) => d[1]).filter((n) => n > 0).sort((a, b) => a - b);
  const q = (p) => nz[Math.min(nz.length - 1, Math.floor(p * nz.length))] || 1;
  const cuts = [q(0.25), q(0.5), q(0.8)];
  const level = (n) => (n === 0 ? 0 : n <= cuts[0] ? 1 : n <= cuts[1] ? 2 : n <= cuts[2] ? 3 : 4);
  const lead = new Date(days[0][0] + "T00:00:00").getDay();
  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<i class="e"></i>`;
  days.forEach(([d, n]) => { cells += `<i class="l${level(n)}" title="${n} on ${dateFmt(d)}"></i>`; });
  $("graph").innerHTML = cells;
  $("graph").style.setProperty("--weeks", Math.ceil((days.length + lead) / 7));
  $("graph-scroll").scrollLeft = 1e6;
  $("graph-cap").innerHTML = `<span class="r">${G.contributions.total.toLocaleString("en-AU")} contributions</span> in the last year. ${G.stars} stars across ${G.publicRepos} public repos.`;
  $("updated").textContent = `github numbers as of ${dateFmt(G.updated)}.`;
})();

// laser eyes: beams from the pupils in the photo to the pointer (finger on touch).
// lasers cut on and off; only the flicker moves on its own.
(() => {
  const img = document.getElementById("me");
  const EYES = [[0.4026, 0.2959], [0.5352, 0.2858]]; // pupils, found with apple vision on assets/hugh.jpg
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cv = document.createElement("canvas");
  cv.className = "lasers";
  cv.setAttribute("aria-hidden", "true");
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  let ptr = null, raf = 0, dpr = 1;

  const size = () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(innerWidth * dpr);
    cv.height = Math.round(innerHeight * dpr);
    cv.style.width = innerWidth + "px";
    cv.style.height = innerHeight + "px";
    request();
  };

  function flare(x, y, r) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.2, "rgba(255,110,100,0.95)");
    g.addColorStop(0.5, "rgba(225,6,0,0.45)");
    g.addColorStop(1, "rgba(225,6,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    // anamorphic streak
    ctx.save(); ctx.translate(x, y); ctx.scale(4.5, 0.22);
    ctx.beginPath(); ctx.arc(0, 0, r * 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function beam(x0, y0, x1, y1, s, f) {
    const layers = [
      [11 * s * f, "rgba(225,6,0,0.28)", 22],
      [4.5 * s * f, "rgba(232,20,8,0.9)", 10],
      [1.6 * s * f, "rgba(255,240,236,1)", 0],
    ];
    ctx.lineCap = "round";
    for (const [w, c, blur] of layers) {
      ctx.shadowColor = "rgba(225,6,0,0.9)";
      ctx.shadowBlur = blur;
      ctx.strokeStyle = c;
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  function draw() {
    raf = 0;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (!ptr) return;
    const r = img.getBoundingClientRect();
    if (r.bottom < 0 || !r.width) return;
    const s = r.width / 148;
    const f = reduce ? 1 : 0.85 + Math.random() * 0.3;
    const eyes = EYES.map(([ex, ey]) => [r.left + ex * r.width, r.top + ey * r.height]);
    for (const [x, y] of eyes) beam(x, y, ptr[0], ptr[1], s, f);
    // burn spot where they meet
    flare(ptr[0], ptr[1], 16 * s * f);
    for (const [x, y] of eyes) flare(x, y, 13 * s * f);
    if (!reduce) request(); // keep flickering while the lasers are on
  }

  function request() { if (!raf) raf = requestAnimationFrame(draw); }
  const on = (e) => { ptr = [e.clientX, e.clientY]; request(); };
  const off = () => { ptr = null; request(); };

  addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" || e.buttons) on(e); }, { passive: true });
  addEventListener("pointerdown", on, { passive: true });
  addEventListener("pointerup", (e) => { if (e.pointerType !== "mouse") off(); }, { passive: true });
  addEventListener("pointercancel", off, { passive: true });
  document.addEventListener("pointerleave", off);
  document.documentElement.addEventListener("mouseleave", off);
  addEventListener("blur", off);
  addEventListener("scroll", request, { passive: true });
  addEventListener("resize", size);
  size();
})();
</script>
</body>
</html>
